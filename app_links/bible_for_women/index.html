<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>

  <!-- 1️⃣ Meta 自动跳转（部分浏览器 / 无 JS 场景） -->
  <meta http-equiv="refresh" content="0;url=https://play.google.com/store/apps/details?id=weatherapp.forecast.live.elements.climate.track.report" />

  <!-- 2️⃣ JS 自动跳转（主流浏览器） -->
  <script>
    window.location.replace(
      "https://play.google.com/store/apps/details?id=womensbible.study.devotional.dailyscripture.bible"
    );
  </script>
</head>
<body>
  <p>
    Redirecting to Google Play…<br />
    If you are not redirected,
    <a href="https://play.google.com/store/apps/details?id=womensbible.study.devotional.dailyscripture.bible">
      click here
    </a>.
  </p>
</body>
</html>
